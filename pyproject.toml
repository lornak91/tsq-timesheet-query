[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsq"
version = "0.1.0"
description = "Query a plain-text timesheet log for hours per project in a date range"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "lornak91" }]

[project.scripts]
tsq = "tsq:main"

[tool.setuptools]
py-modules = ["tsq"]
